<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>编辑便签 · 蜂巢桌面</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#182020;color:#e7e8dc;font:14px 'Microsoft YaHei UI',sans-serif;display:flex;flex-direction:column;height:100vh;gap:12px}textarea{flex:1;min-height:60px;resize:none;background:#ffffff06;border:1px solid #ffffff22;border-radius:12px;color:inherit;padding:16px;font:15px/1.8 'Microsoft YaHei UI',sans-serif;outline:none}textarea:focus{border-color:#a4cabc77}footer{display:flex;gap:12px;align-items:center}span{flex:1;font-size:12px;color:#b5c2ba}button{background:#ffffff12;color:inherit;border:1px solid #ffffff22;border-radius:8px;padding:8px 12px;cursor:pointer}</style></head><body><textarea id="editor" aria-label="便签内容" maxlength="20000" disabled></textarea><footer><span id="status" role="status">正在读取…</span><button id="save">保存</button><button id="done">完成</button></footer><script src="notes-editor.js"></script></body></html>
