appId: com.justindong.hivedesktop
productName: 蜂巢桌面
asar: false
afterPack: ./tools/release-audit.cjs
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - package.json
  - ui/**
  - tools/*.js
  - tools/*.ps1
  - tools/*.vbs
  - tools/*.cs
  - '!tools/test-*'
  - '!tools/verify-*'
  - '!tools/capture-*'
  - '!tools/launch.ps1'
  - '!tools/install-startup.ps1'
  - '!tools/build-spectrum.ps1'
  - '!tools/build-icon.ps1'
  - '!tools/prepare-release.ps1'
  - '!tools/run-tests.ps1'
  - '!tools/release-checksum.js'
  - '!tools/publish-draft.js'
  - taskbar-policy.json
  - THIRD_PARTY_NOTICES.md
  - LICENSE
  - vendor/NAudio-2.2.1/NAudio.Core.dll
  - vendor/NAudio-2.2.1/NAudio.Wasapi.dll
  - vendor/NAudio-2.2.1/HiveSpectrum.exe
  - vendor/NAudio-2.2.1/LICENSE.txt
win:
  executableName: HiveDesktop
  icon: build/hive.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: 蜂巢桌面
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: HiveDesktop-Setup-${version}-${arch}.${ext}
publish: null
